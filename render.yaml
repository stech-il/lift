# Render Blueprint — למונורפו: הקוד Node נמצא תחת server/
# https://render.com/docs/monorepo-support#setting-a-root-directory
#
# דיסק קבוע, DATA_DIR, משתנים — כמו ב-server/render.yaml
services:
  - type: web
    name: pirsum
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: CLIENT_DOWNLOADS_DIR
        value: /data/client-downloads
      - key: PUBLIC_BASE_URL
        value: https://pirsum.s-tech.co.il
      - key: ENFORCE_HTTPS
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
    disk:
      name: pirsum-data
      mountPath: /data
      sizeGB: 1
